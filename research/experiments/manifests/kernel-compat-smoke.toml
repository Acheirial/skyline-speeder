# 多内核版本适配性冒烟——KVM 形态。正确性/适配性为主，不是性能验证：
# 不做吞吐/goodput 对比、不做 CV 门槛、不做 B1/B2 中性性、不做多 CC 性能矩
# 阵、不做超参 sweep、也不是目标环境网格级别的验证。
# `performance_valid=true` 只是 formal-kvm 这个 execution_class 的 schema
# 约束（matrix_lib.py 的 validate_manifest 强制要求），这份 manifest 的
# 任何数字都不得写成算法收益结论。
#
# 场景形状复制自 retransmit-dscp-mechanism.toml 已经验证过的机制冒烟口径
# （rtt_ms=100/rate_mbit=50/loss_pct=5%/offload=off，warmup/duration 短），
# 分 v4/v6 各一份，2 profile × 2 scenario = 4 case，几分钟内跑完：
#   - compat-cubic-marked：同时开 retransmit_dscp（覆盖 TC 重传标记）和
#     rack_rto（覆盖 sockops RTO 调整生效性——floor_us 设得明显高于该路径
#     自然 RTO，在 ss -tin 的 rto: 字段上应该能直接看出来），modules=[]
#     不碰 struct_ops，隔离验证"不用 skyline_cc 时这两个机制本身能不能在这
#     个内核上工作"。
#   - compat-skyline-full：开全部 4 个模块，验证 struct_ops CC 在真实负载下
#     持续挂载（不是只过一次 --verify-bpf 就 detach）。
name = "kernel-compat-smoke"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260806
warmup_s = 3
duration_s = 8
runs = 1
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_ip6 = "fd20:1::2"
server_data_interface = "data0"

[[profiles]]
id = "compat-cubic-marked"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[profiles.retransmit_dscp]
enabled = true
dscp_value = 10

[profiles.rack_rto]
enabled = true
srtt_permille = 1000
floor_us = 150000
ceiling_us = 200000
warmup_samples = 2
rto_max_normal_permille = 0
rto_max_congested_permille = 0
rto_max_congestion_ratio_permille = 0

[[profiles]]
id = "compat-skyline-full"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[[scenarios]]
id = "compat-smoke-v4"
rtt_ms = 100
rate_mbit = 50
queue_bdp = 1.0
loss_model = "random"
loss_pct = 5.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
capture_retransmits = true
address_family = "v4"

[[scenarios]]
id = "compat-smoke-v6"
rtt_ms = 100
rate_mbit = 50
queue_bdp = 1.0
loss_model = "random"
loss_pct = 5.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"
capture_retransmits = true
address_family = "v6"
