# 目标box全9点网格——覆盖 b0-stock-cubic（真正未改动的内核默认：
# fq_codel + 默认 sysctl）与真正激活的 M1 tier-2 rack_rto。
#
# skyline-best 显式带上 [profiles.rack_rto]（enabled=true，与
# config/speeder.toml 出厂默认一致：srtt_permille=1100/floor_us=20000/
# ceiling_us=200000/warmup_samples=4/rto_max_normal_permille=3000/
# rto_max_congested_permille=6000），module_config 显式写全部字段（含
# guardrail_gain=0.8，不依赖脚本默认值）。
#
# 5 profile（b0/b1/bbr-fq/b2-skyline-base/skyline-best）× 9 场景（rtt{100,200,300}
# × loss{10,15,20}%，rate_mbit=100，offload=off）× runs=2 = 90 case，
# ~75-90 分钟。
#
# 验收：主判据 median(skyline-best) >= 1.05 * max(median(b0), median(b1),
# median(bbr))；稳健性判据 min_over_runs(skyline-best) >
# max_over_runs(baseline)（BBR 在部分点双峰分布，n=2 时用它的 median 做门
# 槛不稳，改用"最小值仍大于对方任何一次跑出来的最大值"这种不受抽样运气
# 影响的判据）。不达标点如实记录，不隐藏、不为了让某一项通过而重跑挑数据。
name = "target-box"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260806
warmup_s = 12
duration_s = 25
runs = 2
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b0-stock-cubic"
kind = "stock-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[[profiles]]
id = "b2-skyline-base"
kind = "skyline"
cc = "skyline_cc"
modules = []

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[scenarios]]
id = "rtt100-loss10"
rtt_ms = 100
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 10.0
loss_direction = "data"
burst_length = 1
parallel = 1
offload = "off"

