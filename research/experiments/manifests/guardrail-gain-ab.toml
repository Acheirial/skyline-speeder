# 护栏真正生效的场景 + guardrail_gain A/B。目标 box 网格里护栏基本不
# 触发，这份 manifest 专门选了护栏确实频繁触发的 7 个场景做定向验证
# （按需单独跑，不是默认回归矩阵的一部分）：
#   intercontinental-clean、reorder-dsack、burst-loss、light-loss、
#   primary、heavy-loss、line-rate
#
# skyline-guardrail-neutral 跟 skyline-best 完全一致，只把 guardrail_gain 改回
# 0.0（钳位到中性 1.0，不主动降速）——skyline-best 减 skyline-guardrail-neutral
# 的差值就是这个系数本身的边际效果。intercontinental-clean（0%丢包/
# 400ms RTT/1000Mbit 纯净对照场景）风险最高：护栏一直触发，"钳位到中性"
# 变成"真的降到 0.8x"可能让该场景从反超基线变成不如基线——如果真的退步，
# 如实记录、讨论取舍，不为了让这一项也"通过"而回退这个系数。
#
# 5 profile（b0-stock-cubic/b1-controlled-cubic/bbr-fq/skyline-best/
# skyline-guardrail-neutral）× 7 场景 × runs=3 = 105 case，~1.5-2 小时。
name = "guardrail-gain-ab"
execution_class = "formal-kvm"
performance_valid = true
seed = 20260810
warmup_s = 15
duration_s = 30
runs = 3
stock_qdisc = "fq_codel"
server_ssh = "skyline@127.0.0.1:2222"
client_ssh = "skyline@127.0.0.1:2223"
server_data_ip = "10.20.1.2"
server_data_interface = "data0"

[[profiles]]
id = "b0-stock-cubic"
kind = "stock-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "b1-controlled-cubic"
kind = "controlled-cubic"
cc = "cubic"
modules = []

[[profiles]]
id = "bbr-fq"
kind = "bbr"
cc = "bbr"
modules = []

[[profiles]]
id = "skyline-best"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.8
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[profiles]]
id = "skyline-guardrail-neutral"
kind = "skyline"
cc = "skyline_cc"
modules = ["early-loss", "adaptive-cwnd", "loss-classifier", "pacing"]

[profiles.module_config]
max_pacing_mbps = 1200
max_cwnd_packets = 50000
max_queue_delay_ms = 100
max_queue_delay_ratio = 1.0
initial_cwnd_packets = 100
min_rtt_window_s = 10
bw_window_rtts = 10
startup_plateau_rtts = 3
startup_growth_ratio = 0.25
startup_gain = 3.0
cruise_inflight_gain = 2.0
cruise_pacing_gain = 1.1
guardrail_gain = 0.0
loss_inflation_max_ratio = 0.5

[profiles.rack_rto]
enabled = true
srtt_permille = 1100
floor_us = 20000
ceiling_us = 200000
warmup_samples = 4
rto_max_normal_permille = 3000
rto_max_congested_permille = 6000
rto_max_congestion_ratio_permille = 0

[[scenarios]]
id = "line-rate"
rtt_ms = 20
rate_mbit = 1000
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.0
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "light-loss"
rtt_ms = 80
rate_mbit = 500
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.1
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "primary"
rtt_ms = 150
rate_mbit = 500
queue_bdp = 1.0
loss_model = "random"
loss_pct = 0.5
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "heavy-loss"
rtt_ms = 250
rate_mbit = 100
queue_bdp = 1.0
loss_model = "random"
loss_pct = 2.0
loss_direction = "data"
burst_length = 1
parallel = 1

[[scenarios]]
id = "burst-loss"
rtt_ms = 150
rate_mbit = 500
queue_bdp = 1.0
loss_model = "gemodel"
loss_pct = 0.5
loss_direction = "data"
